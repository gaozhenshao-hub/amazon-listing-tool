name: amz-fullchain
x-app-base: &app-base
  image: amz-fullchain:local
  build:
    context: ../..
    dockerfile: deploy/aliyun/Dockerfile
  env_file:
    - .env
  restart: unless-stopped
  networks:
    - app-internal
  depends_on:
    mysql:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_APP_USER}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --skip-name-resolve
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  web:
    <<: *app-base
    command: ["node", "dist/index.js"]
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 30s

  ai-worker:
    <<: *app-base
    command: ["node", "dist/aiWorker.js"]
    environment:
      APP_PROCESS_ROLE: worker
      AI_JOB_RUNNER_MODE: worker

  scheduler:
    <<: *app-base
    command: ["node", "dist/scheduler.js"]
    environment:
      APP_PROCESS_ROLE: scheduler

  db-backup:
    profiles: ["tools"]
    build:
      context: ./backup
      dockerfile: Dockerfile
    image: amz-fullchain-db-backup:local
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION}
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - ./scripts:/scripts:ro
    networks:
      - app-internal
    depends_on:
      mysql:
        condition: service_healthy
    command: ["/scripts/backup-mysql.sh"]

networks:
  app-internal:
    driver: bridge

volumes:
  mysql-data:
