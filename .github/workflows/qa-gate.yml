name: QA Gate

on:
  push:
  pull_request:

jobs:
  unit-gate:
    name: Lint, typecheck, unit and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ALLOW_REAL_NETWORK_IN_TESTS: "0"
      RUN_REAL_LLM_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm qa:gate
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: warn
          retention-days: 14

  frontend-gate:
    name: Bundle budget and core workflow E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: unit-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build Web, Worker and Scheduler and compare bundle budget
        run: pnpm build
        env:
          BUNDLE_REPORT_PATH: artifacts/bundle-report.json
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run core workflow E2E
        run: pnpm test:e2e
      - name: Upload bundle and E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-qa-reports
          path: |
            artifacts/bundle-report.json
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

  real-db-gate:
    name: Real DB regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: unit-gate
    services:
      mysql:
        # Candidate tag only: the verified local server was Ubuntu MySQL 8.0.46.
        # Container availability and full CI still require separate validation.
        image: mysql:8.0.46
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: amazon_listing_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      REAL_DB_TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/amazon_listing_ci
      FRESH_BOOTSTRAP_DATABASE_URL: mysql://root:root@127.0.0.1:3306/amazon_listing_ci
      DOTENV_CONFIG_PATH: /dev/null
      RUN_REAL_LLM_TESTS: "0"
      ALLOW_REAL_NETWORK_IN_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Inspect offline fresh bootstrap plan
        run: pnpm db:bootstrap:fresh:plan
      # Do not bypass the approved full-contract gate or fall back to db:migrate.
      - name: Initialize empty CI schema through the approved fresh bootstrap
        run: pnpm db:bootstrap:fresh --environment ci --schema amazon_listing_ci
      - name: Verify repeat without migrations or reseeding
        run: pnpm db:bootstrap:fresh --environment ci --schema amazon_listing_ci
      - name: Run migrated MySQL, Worker and lifecycle integration tests
        run: pnpm test:real-db --environment ci --schema amazon_listing_ci
